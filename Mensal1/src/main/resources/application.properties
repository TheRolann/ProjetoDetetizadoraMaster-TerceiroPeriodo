# =====================
# CONFIGURACAO DO BANCO DE DADOS
# =====================

# URL de conexao: jdbc:postgresql://[host]:[porta]/[banco]
spring.datasource.url=jdbc:postgresql://localhost:5432/detetizadora_master

# Usuario do PostgreSQL
spring.datasource.username=postgres

# Senha do PostgreSQL
spring.datasource.password=132435

# Driver JDBC
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================
# CONFIGURACAO DO FLYWAY
# =====================

# Pasta onde estao os scripts de migracao
spring.flyway.locations=classpath:db/migration

# Nome da tabela que rastreia as migrations (nao mexa!)
spring.flyway.table=flyway_schema_history

# Modo de validacao (validar se as migrations ja rodadas nao foram modificadas)
spring.flyway.validate-on-migrate=true

# Ativar Flyway automaticamente na inicializacao
spring.flyway.enabled=true

